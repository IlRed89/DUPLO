<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUPLO - Trova File Duplicati</title>
  <!-- Stili locali: nessun font o CSS da CDN, così l'app resta usabile offline. -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Overlay drop full-window: visibile con .active. I figli hanno pointer-events:none
       (anti-flicker). preventDefault su window+overlay; path via webUtils.getPathForFile. -->
  <div id="drag-overlay" class="drag-overlay" aria-hidden="true">
    <div class="drag-overlay-panel" role="status" aria-live="polite">
      <p class="drag-overlay-title">Trascina qui le cartelle</p>
      <p class="drag-overlay-hint">Rilascia ovunque nella finestra per aggiungerle alla scansione</p>
    </div>
  </div>

  <!-- Header Superiore dell'Applicazione -->
  <header class="app-header">
    <div class="brand">
      <!-- Icona Fase 1: stesso SVG in build/icon.svg, incorporato (nessun download). -->
      <img class="brand-icon" src="../../build/icon.svg" width="36" height="36" alt="DUPLO">
      <div class="brand-text">
        <h1>DUPLO <span class="badge">v1.1.3</span></h1>
        <p>Ricerca e pulizia sicura di file duplicati</p>
      </div>
    </div>
    <div class="header-actions">
      <select id="selectLanguage" class="input-field lang-select" title="Lingua del menu di sistema">
        <option value="it" selected>Italiano</option>
        <option value="en">English</option>
      </select>
      <button class="btn btn-secondary btn-sm" id="btnShowGuide" title="Apri il manuale README incluso nel programma">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        Guida
      </button>
      <button class="btn btn-secondary btn-sm" id="btnShowLogPath" title="Mostra percorso file di log di diagnostica">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        File di Log
      </button>
    </div>
  </header>
