name: Align package-lock DUPLO 1.0.0

on:
  push:
    paths:
      - ".github/workflows/restore-package-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-package-lock
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set package-lock root version to 1.0.0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("package-lock.json")
          text = p.read_text()
          text = text.replace('"version": "1.1.4"', '"version": "1.0.0"', 2)
          out = text.encode("utf-8")
          if len(out) != 211031:
              raise SystemExit(f"size {len(out)}")
          blob = hashlib.sha1(b"blob %d\0" % len(out) + out).hexdigest()
          if blob != "d29e7c9cd3fc06db68723d31617fa2aa3e8b33be":
              raise SystemExit(f"blob {blob}")
          p.write_bytes(out)
          print("ok", len(out), blob)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-package-lock.yml
          git add package-lock.json .github/workflows/restore-package-lock.yml
          git commit -m "chore(release): allinea package-lock a DUPLO 1.0.0"
          git push
