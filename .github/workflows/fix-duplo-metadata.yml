name: Fix DUPLO metadata

on:
  push:
    paths:
      - ".github/workflows/fix-duplo-metadata.yml"
      - "scripts/fix-duplo-metadata.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Homepage, lockfile, SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/fix-duplo-metadata.sh
      - name: Commit package-lock rinominato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock già DUPLO"
          else
            git commit -m "chore: rinomina package-lock da dupfinder a duplo"
            git push
          fi
