name: Build & Release DUPLO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: write-all

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: ubuntu-latest
            script: dist:linux
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    permissions: write-all

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build ZIP packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}

      - name: List ZIP artifacts
        shell: bash
        run: ls -la dist/*.zip

      - name: Keep ZIP artifacts on the Actions run
        uses: actions/upload-artifact@v4
        with:
          name: duplo-zips-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload Binaries to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nessuno zip in dist/" >&2
            ls -la dist || true
            exit 1
          fi
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
