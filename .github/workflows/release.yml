name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: go test ./...

      - name: Build (windows / linux / macOS)
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-X main.version=${VERSION}"
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o DupFinder-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dupfinder-linux-amd64 .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dupfinder-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dupfinder-darwin-arm64 .
          sha256sum DupFinder-windows-amd64.exe dupfinder-* > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DupFinder-windows-amd64.exe
            dupfinder-linux-amd64
            dupfinder-darwin-amd64
            dupfinder-darwin-arm64
            SHA256SUMS.txt
