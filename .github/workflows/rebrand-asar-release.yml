name: Rebrand asar DUPLO negli zip

# Temporaneamente solo manuale, per caricare i sorgenti v1.1.0
# senza far partire l'overlay a metà commit.
on:
  workflow_dispatch:

concurrency:
  group: rebrand-asar-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebrand:
    name: Nuova release con asar aggiornato
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Overlay asar + GitHub Release da package.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/rebrand-asar-release.sh
