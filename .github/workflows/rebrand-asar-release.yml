name: Rebrand asar DUPLO negli zip

on:
  push:
    paths:
      - ".github/workflows/rebrand-asar-release.yml"
      - "scripts/rebrand-asar-release.sh"
      - "main.js"
      - "preload.js"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - "src/**"
  workflow_dispatch:

concurrency:
  group: rebrand-asar-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebrand:
    name: Nuova release con asar aggiornato
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Overlay asar + GitHub Release da package.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          HOUSEKEEPING: "1"
          RECREATE_DEST: "1"
          SOURCE_TAG: "auto"
        run: bash scripts/rebrand-asar-release.sh
