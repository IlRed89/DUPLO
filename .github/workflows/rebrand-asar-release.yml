name: Rebrand asar DUPLO negli zip

# Disattivato sul push automatico: la release ufficiale è
# `.github/workflows/release.yml` (Windows, tag v*).
# Resta disponibile a mano se serve un overlay asar di emergenza.
on:
  workflow_dispatch:

concurrency:
  group: rebrand-asar-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebrand:
    name: Overlay asar (manuale)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Overlay asar + GitHub Release da package.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          HOUSEKEEPING: "1"
          RECREATE_DEST: "1"
          SOURCE_TAG: "auto"
        run: bash scripts/rebrand-asar-release.sh
