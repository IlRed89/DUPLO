name: Update DUPLO repo profile

# DUPLO è SOLO Electron / Node.js / JavaScript.
# Questo job sovrascrive descrizione e topic (niente golang, niente linguaggi estranei).
on:
  push:
    paths:
      - ".github/workflows/update-duplo-profile.yml"
      - "scripts/fix-duplo-metadata.sh"
      - "package.json"
  workflow_dispatch:

permissions: write-all

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Descrizione, homepage e topic Electron/JS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo edit IlRed89/DUPLO \
            --description "DUPLO — Duplicate File Finder desktop (Electron / Node.js / JavaScript). Hash SHA-256/MD5." \
            --homepage "https://github.com/IlRed89/DUPLO"
          gh api -X PUT /repos/IlRed89/DUPLO/topics \
            -H "Accept: application/vnd.github+json" \
            --input - <<'JSON'
          {"names":["electron","javascript","nodejs","duplicate-files","windows"]}
          JSON
