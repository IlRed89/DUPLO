name: Restore DUPLO v1.0.0 Windows ZIP

on:
  push:
    paths:
      - '.github/workflows/restore-v1-zips.yml'
  workflow_dispatch:

permissions: write-all

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions: write-all

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows ZIP Packages (x64 & ia32)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: List ZIP artifacts
        shell: bash
        run: ls -la dist/*.zip

      - name: Keep ZIP artifacts on the Actions run
        uses: actions/upload-artifact@v4
        with:
          name: duplo-windows-zips
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach ZIP files to GitHub Release v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la dist/DUPLO-1.0.0-win-x64.zip dist/DUPLO-1.0.0-win-ia32.zip
          gh release upload v1.0.0 \
            dist/DUPLO-1.0.0-win-x64.zip \
            dist/DUPLO-1.0.0-win-ia32.zip \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
