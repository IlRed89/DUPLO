name: Rebuild DUPLO release zips

on:
  push:
    paths:
      - ".github/workflows/rebuild-duplo-release.yml"
      - "scripts/rebuild-duplo-assets.sh"
  workflow_dispatch:

concurrency:
  group: rebuild-duplo-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    name: Ricompila zip con DUPLO.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build e upload asset DUPLO
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bash scripts/rebuild-duplo-assets.sh 2>&1 | tee rebuild.log
      - name: Pubblica log se la build fallisce
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          tail -n 250 rebuild.log > docs/rebuild-error.log
          git add docs/rebuild-error.log
          git commit -m "ci: log errore rebuild zip DUPLO" || true
          git push || true
